name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'project-source.zip'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive exists
        run: test -f project-source.zip

      - name: Extract project source
        run: unzip -q project-source.zip -d source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/ai-trading-assistant/frontend/package.json

      - name: Install frontend dependencies
        working-directory: source/ai-trading-assistant/frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: source/ai-trading-assistant/frontend
        env:
          VITE_DEMO_MODE: 'true'
          VITE_APP_NAME: AI Trading Assistant
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/ai-trading-assistant/frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
